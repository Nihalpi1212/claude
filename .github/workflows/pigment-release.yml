# Pigment release builds.
#
# Builds the installers with electron-builder on each platform's own runner:
#   macos-latest   -> universal (Apple silicon + Intel) .dmg and .zip
#   windows-latest -> NSIS installer (x64 + arm64) and a portable .exe
#   ubuntu-latest  -> AppImage
#
# Runs on tags named pigment-v* and on demand. A tag push, or a manual run with the `tag` input set,
# also creates (or updates) the GitHub Release for that tag with the installers attached; a manual
# run without `tag` only uploads workflow artifacts. The builds are NOT code-signed (no certificates
# in this repository), so macOS Gatekeeper and Windows SmartScreen show a warning on first launch;
# see pigment/README.md.

name: Pigment release

on:
  push:
    tags:
      - 'pigment-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. pigment-v0.1.0 (leave empty to only build the installers)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg zip --universal
          - os: windows-latest
            args: --win nsis portable
          - os: ubuntu-latest
            args: --linux AppImage
    defaults:
      run:
        working-directory: pigment
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pigment/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: List artifacts
        shell: bash
        run: ls -la dist | grep -v -E "builder-|\.yml$|\.blockmap$" || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pigment-${{ matrix.os }}
          path: |
            pigment/dist/*.dmg
            pigment/dist/*.zip
            pigment/dist/*.exe
            pigment/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/pigment-v') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Pigment ${{ env.RELEASE_TAG }}
          body: |
            Free, open-source image editor for Windows, macOS and Linux: layers, groups, masks, vector
            masks and clipping masks, smart objects with smart filters, 27 blend modes, adjustment and
            fill layers, layer styles with Blending Options, brushes, retouching (healing, clone, patch,
            dodge/burn), selections (marquee, lasso, magic wand, quick selection, color range, quick
            mask), free transform, Warp, Perspective Warp and Puppet Warp, multi-style text shaped by
            HarfBuzz (on a path, stacked vertical), live shapes with path operations and the pen tool,
            gradients and patterns, guides and Smart Guides, printing, PSD import/export, with
            Photoshop's default shortcuts. See pigment/README.md.

            **New in 0.4**: several fonts, sizes and styles in one text layer, shaped by HarfBuzz, with
            on-canvas editing and the Character and Paragraph panels (kerning, tracking, scales, baseline
            shift, caps, justification, composers, hyphenation in eight languages, lists); Blending Options
            with knockout and Blend If (adjustment layers get them too, without knockout), layer styles on groups and the ten
            effects with contours, noise, textures, gradient and pattern strokes and several instances of an
            effect; finished Levels, Curves, Hue/Saturation and the other adjustment dialogs with presets
            and eyedroppers, Color and Vibrance, Clarity and Dehaze, Grain, the Adjustments panel presets
            and the Adjustment Brush; the Gradient Editor, Gradients and Patterns panels, live gradients and
            Scripted Patterns; guides with colours, rulers with units and origin, Snap To and Smart Guides;
            vector masks and mask density and feather; live shapes with corner radii, gradient and pattern
            fills and dashed strokes; the Layers panel's effect rows, scrubby fields and drag gestures, and
            the rest of the Layer menu (New Layer and Duplicate dialogs, Distribute, Lock Layers, Merge
            Group, Stamp Visible, the Background rules); Photoshop's default shortcuts, Search,
            spring-loaded tools, numeric fields with arithmetic and units, and movable dialogs. Layer
            effects now blend with the layers below in their own blend modes, as in Photoshop (a Multiply
            shadow darkens, a Screen glow lightens), so documents with such effects can look different from
            0.3. Testing fixed several dozen problems where features meet (Merge Clipping Mask on Ctrl+E,
            Lock All, Flatten asking about hidden layers, PSD text, Hue/Saturation ranges, Gradient Maps and
            guides), and large documents repaint much faster. Some keys moved to Photoshop's meanings:
            Ctrl+F is Search (Last Filter is Alt+Ctrl+F), Alt+Ctrl+Z is Toggle Last State, Ctrl+Y is Proof
            Colors. PSD files do not yet carry layer effects and most of the new layer features (0.5); the
            merged image is right. pigment/docs/RELEASE-NOTES-0.4.md lists every change and known gap, and
            pigment/docs/PARITY.md compares Pigment with Photoshop feature by feature.

            **From 0.3**: the Filter menu and Filter Gallery, Blur Gallery, image modes, 16/32 bits, Actions.

            **AI (optional)**: sign in with ChatGPT (uses your Plus/Pro plan) or add an OpenAI or
            Google Gemini API key in AI › AI Accounts for Generative Fill / Expand, Generate Image,
            Remove / Replace Background, Replace Sky, Describe Image and the AI Assistant panel.
            Image generation needs an API key. See pigment/docs/USER-GUIDE.md.

            **Downloads**
            - Windows: `pigment-*-win-x64.exe` (installer) or `pigment-*-win-portable.exe` (no install)
            - macOS: `pigment-*-mac-universal.dmg` (Apple silicon and Intel)
            - Linux: `pigment-*-linux-x86_64.AppImage`

            These builds are not code-signed. On macOS, right-click the app and choose Open the first
            time (or run `xattr -dr com.apple.quarantine /Applications/Pigment.app`). On Windows,
            choose "More info" then "Run anyway" in the SmartScreen prompt.
          files: installers/*
