# Pigment CI: the quality gate for the Rust workspace in pigment/ (Pigment is based on PhotoCraft).
#
# The steps follow PhotoCraft's own gate (`cargo xtask ci`, run by storytold/craft-common-actions'
# gate.yml, and its packaging-lint.yml), written out here instead of calling those reusable
# workflows: rustfmt, clippy with warnings as errors, the workspace tests (cargo-nextest, as
# upstream runs them), the engine's panic hunt and the doctests, the repository checks xtask
# provides, the packaging script tests, the rebrand check, and a smoke test of the pigment-cli
# binary. Left out from upstream's gate, because they need another toolchain, the network beyond
# the pinned checkouts below, secrets or corpora: the wasm check (the web app is not part of
# Pigment's releases), the GPU lavapipe scripts, the Windows legs, the corpus, fuzz and benchmark
# jobs, and SonarCloud.
#
# The tests need no secrets. The interface translations come from storytold/craft-i18n at the
# commit in pigment/craft-i18n.rev, so the rebranded catalogues (crates/ui-egui/build.rs) are
# built and tested, and the fonts from storytold/craft-fonts at PhotoCraft's pinned commit (as in
# upstream's gate): the interface tests in Japanese, Chinese, Korean and Arabic need its glyphs.

name: Pigment CI

on:
  push:
    paths:
      - 'pigment/**'
      - '.github/workflows/pigment-ci.yml'
  pull_request:
    paths:
      - 'pigment/**'
      - '.github/workflows/pigment-ci.yml'

permissions:
  contents: read

concurrency:
  group: pigment-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Rust release Pigment is built and linted with. The workspace's minimum (rust-version in
  # pigment/Cargo.toml) is 1.95; move this forward deliberately, together with pigment-release.yml,
  # since a new clippy can bring new warnings.
  RUST_TOOLCHAIN: '1.97.0'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # As upstream's gate (dev-debug "0", CARGO_PROFILE_TEST_STRIP): the dev and test builds carry no
  # debuginfo and the test binaries no symbols, so the test build is ~6.5 GB instead of ~19 GB and
  # fits the runner's disk. A panic still names its file and line; only backtrace frames lose
  # their names.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_STRIP: symbols
  RUST_BACKTRACE: 1
  # As upstream's gate: no test may print a page, and a stray `lp` fails on a printer that doesn't
  # exist.
  PHOTOCRAFT_NO_PRINT: '1'
  LPDEST: pigment-no-such-printer

jobs:
  gate:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: pigment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Nothing waits on it: the space is free before the build needs it.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &

      - name: Read the craft-i18n pin
        id: i18n
        run: echo "rev=$(tr -d '[:space:]' < craft-i18n.rev)" >>"$GITHUB_OUTPUT"

      - name: Check out craft-i18n
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-i18n
          ref: ${{ steps.i18n.outputs.rev }}
          path: craft-i18n
          persist-credentials: false

      # Same commit as pigment-release.yml and PhotoCraft's own gate.
      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-fonts
          ref: cc9269cd8d8258785dac603fba3122e5d2556795
          path: craft-fonts
          persist-credentials: false

      # The Linux build's system libraries (upstream's gate packages; mesa-vulkan-drivers gives the
      # GPU tests lavapipe) and the packaging tests' tools.
      # The runner image also lists Microsoft's package repository, which none of this uses. When
      # it refuses requests (403 Forbidden on Nov 27, 2026), apt-get update fails, and with it
      # every check after this step, so leave that repository out.
      - name: Install Linux build dependencies
        run: |
          grep -rlZ 'packages\.microsoft\.com' /etc/apt/sources.list.d 2>/dev/null | xargs -0 -r sudo rm -f --
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev mesa-vulkan-drivers libvulkan1 pkg-config \
            desktop-file-utils appstream file python3-yaml

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pigment
          # Pull requests read the cache but never write it.
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true

      - name: Translations and fonts
        run: |
          {
            echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n"
            echo "CRAFT_I18N_REQUIRED=1"
            echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts"
            echo "CRAFT_FONTS_REQUIRED=1"
          } >>"$GITHUB_ENV"

      - name: Lockfile is current
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Rebrand is complete
        run: python3 scripts/pigment-rebrand.py --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features heif --keep-going -- -D warnings

      # cargo-nextest, the runner upstream's gate uses (`cargo xtask ci`), at the version
      # .config/nextest.toml requires. It runs every test in a process of its own, which is what
      # PhotoCraft's tests are written for. Under `cargo test` the tests of one binary share a
      # process, and automation's bridge authentication test (a 5 s deadline) timed out there in
      # two runs of five. rust-cache keeps the installed binary, so this builds once per cache.
      - name: Install cargo-nextest
        run: cargo nextest --version 2>/dev/null | grep -q 'cargo-nextest 0\.9\.150' || cargo install cargo-nextest --version 0.9.150 --locked

      # Unit and integration tests without the examples (clippy has checked those), as upstream's
      # gate runs them (nextest's `ci` profile: no fail-fast, hung tests end, every failure is
      # repeated at the end of the log), then the doctests. The integration tests that already
      # fail on PhotoCraft's own tree at the imported revision (scripts/upstream-test-failures.txt,
      # which says why) are left out here by package and exact name
      # (scripts/upstream-test-filter.py builds the filter) and run on their own in the next step.
      - name: Tests
        run: |
          set -euo pipefail
          cargo nextest run --profile ci --workspace --locked --features heif --lib --bins --tests \
            -E "$(python3 scripts/upstream-test-filter.py --skip)"

      # Informational: shows when a later upstream merge makes them pass (then drop their lines).
      - name: Known upstream test failures (not gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # The same packages and features as the Tests step, so nothing is rebuilt; every other
          # test is filtered out. With an empty list (as since the 057297b merge) nothing runs.
          cargo nextest run --profile ci --workspace --locked --features heif --lib --bins --tests \
            --no-tests=pass -E "$(python3 scripts/upstream-test-filter.py --only)"

      # The steps below don't depend on the tests, so they run (and report) even when tests fail.

      # Upstream's AGENTS.md rule 9: no command may panic or hang on adversarial parameters. The
      # hunt is `#[ignore]`d (slow); the gate runs it alone, as `cargo xtask ci` does, with the
      # same packages, features and targets as the tests, so nothing is rebuilt.
      - name: Panic hunt
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --profile ci --workspace --locked --features heif --lib --bins --tests \
            --run-ignored only -E 'binary_id(photocraft-engine::panic_hunt)'

      - name: Doctests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --features heif --no-fail-fast --doc

      # The repository checks of upstream's gate (`cargo xtask ci`) and packaging-lint.yml that need
      # no extra toolchain.
      # egui-fork: the workspace's egui fork pin is the one the craft framework is built against
      # (craft::egui_fork::REV). test-binaries: a crate's integration tests are modules of one
      # binary, tests/it/main.rs (the allow-listed exceptions are in xtask/src/test_binaries.rs).
      - name: Repository checks (egui fork, layers, panel commands, test binaries, scorecard)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo xtask egui-fork
          cargo xtask layers
          cargo xtask panel-commands
          cargo xtask test-binaries
          cargo xtask scorecard --check

      - name: Packaging script tests (AppRun, verified downloads, package docs, Flatpak manifests)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash packaging/linux/apprun-test.sh
          bash packaging/linux/apprun-cli-test.sh
          bash packaging/linux/verified-download-test.sh
          bash packaging/linux/package-docs-test.sh
          desktop-file-validate packaging/linux/io.github.nihalpi1212.pigment.desktop
          sed -e 's/@VERSION@/0.0.0/' -e 's/@DATE@/2026-01-01/' \
            packaging/linux/io.github.nihalpi1212.pigment.metainfo.xml.in >"$RUNNER_TEMP/pigment.metainfo.xml"
          appstreamcli validate --no-net --explain "$RUNNER_TEMP/pigment.metainfo.xml"

      # The version line, a document converted to PNG and to Pigment's native `.pigment` and back,
      # a document saved by Pigment 0.4 converted to PNG, and the typed error for a damaged one.
      - name: CLI smoke test
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo build --locked --features heif -p photocraft-cli
          cli="$PWD/target/debug/pigment-cli"
          legacy="$PWD/crates/io/tests/fixtures/pigment-0.4"
          out="$RUNNER_TEMP/pigment-smoke"
          mkdir -p "$out"
          cd "$out"
          "$cli" --version | tee version.txt
          grep -qx 'Pigment [0-9][^ ]* (based on PhotoCraft [0-9][^ ]*)' version.txt
          # An example document: a magenta fill layer and an empty layer, saved as .pigment.
          "$cli" run --new '{"width":64,"height":48,"name":"Example"}' \
            --cmd layer.newFillLayer.solidColor --params '{"color":[225,29,116]}' \
            --cmd layer.new.layer --out example.pigment
          "$cli" convert example.pigment example.png
          "$cli" convert example.png roundtrip.pigment
          "$cli" convert roundtrip.pigment roundtrip.png
          file example.* roundtrip.*
          for f in example.png roundtrip.png; do head -c 8 "$f" | od -An -c | grep -q 'P   N   G'; done
          # The native file is PhotoCraft's format (manifest.json inside) and reads back.
          unzip -l example.pigment | grep -q 'manifest.json'
          "$cli" info roundtrip.pigment >info.json
          grep -q '"width": 64' info.json
          grep -q '"height": 48' info.json
          # A Pigment 0.1-0.4 document (document.json and layers/<id>.png, no manifest.json), written
          # by Pigment 0.4.0 itself: it opens, and converts to PNG and to the native format.
          "$cli" info "$legacy/v3-groups.pigment" >legacy.json
          grep -q '"width": 8' legacy.json
          grep -q '"name": "Outer"' legacy.json
          "$cli" convert "$legacy/v3-groups.pigment" legacy.png
          head -c 8 legacy.png | od -An -c | grep -q 'P   N   G'
          "$cli" convert "$legacy/v3-groups.pigment" converted.pigment
          unzip -l converted.pigment | grep -q 'manifest.json'
          # Its File Info and camera data are read by File Info's own command.
          "$cli" run "$legacy/v3-tags-info.pigment" --cmd file.fileInfo >fileinfo.json
          grep -q '"title":"A title"' fileinfo.json
          grep -q '"exposure":"1/250 s"' fileinfo.json
          # A damaged one (its document.json is cut short) fails with the typed error.
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile("damaged.pigment", "w") as z:
              z.writestr("document.json", '{"version":3,"app":"pigment","width":4')
              z.writestr("layers/1.png", b"\x89PNG\r\n\x1a\n")
          EOF
          if "$cli" info damaged.pigment 2>err.txt; then echo "a damaged Pigment 0.4 document opened" >&2; exit 1; fi
          cat err.txt
          grep -q 'This Pigment 0.4 file is damaged: document.json is not valid JSON' err.txt

      # A build or test must not have changed Cargo.lock.
      - name: Lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
