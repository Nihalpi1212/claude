# Nib CI: unit tests (node:test) and browser end-to-end tests (Playwright) on every change
# under nib/, plus tests that launch the real Electron app under Xvfb.

name: Nib CI

on:
  push:
    paths:
      - 'nib/**'
      - '.github/workflows/nib-ci.yml'
  pull_request:
    paths:
      - 'nib/**'
      - '.github/workflows/nib-ci.yml'

permissions:
  contents: read

jobs:
  test:
    # Pinned: the pinned Playwright release has no browser build for the image ubuntu-latest
    # now points to (Ubuntu 26.04), so `playwright install` fails there. Move this forward
    # together with @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nib/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Electron app tests
        run: xvfb-run -a npm run test:electron

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nib-e2e-artifacts
          path: |
            nib/tests/e2e/.artifacts
            nib/tests/electron/.artifacts
          if-no-files-found: ignore
